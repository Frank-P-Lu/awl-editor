[package]
name = "awl"
version = "0.11.0"
edition = "2024"
# GPL-3.0-only (not "-or-later"): a deliberate, flippable choice — "-only" pins
# distribution to this exact license version; switching to "-or-later" (letting
# a downstream redistribute under any FUTURE GPL version too) is a one-line
# change here + in `NOTICE`/`LICENSE`'s header framing whenever the sole
# copyright holder decides to make it. See `NOTICE` for the full grant text and
# `CREDITS.md`/`THIRD-PARTY-LICENSES.md` for what's bundled alongside it.
# Copyright (C) 2026 Frank Lu.
license = "GPL-3.0-only"

# --- MAS (Mac App Store / App Sandbox) flavor -------------------------------
# OFF by default — the default build is unaffected byte-for-byte (see
# `src/mas.rs`'s module doc + CLAUDE.md's MAS section). Under `--features mas`:
# the single-instance daemon (`src/daemon.rs`) compiles OUT (Launch Services
# already prevents a second launch of a sandboxed app, and MAS has no CLI
# handoff story), and the security-scoped-bookmark folder-grant machinery
# (`src/mas.rs`) compiles IN. The two extra `objc2-foundation` sub-features
# below are needed ONLY for the security-scoped-bookmark NSURL methods
# (`bookmarkDataWithOptions…`/`URLByResolvingBookmarkData…`) — enabled via
# dependency-feature unification so the default (no-`mas`) build's dependency
# feature set is completely unchanged.
[features]
mas = ["objc2-foundation/NSArray", "objc2-foundation/NSData"]

# --- Dev profile: debug-info diet -------------------------------------------
# Trims DWARF from dev builds, which matters because every orchestrator worktree
# carries its own `target/` (27 of them once reached 132 GB — hence
# `.orchestrator/README.md`'s cleanup rule). `line-tables-only` keeps exactly
# what we read — file:line in panic and test backtraces, so a failing capture
# still points at a line — and drops the variable/type DWARF we never touch:
# verification here is headless captures + sidecar assertions, not an
# interactive debugger. Flip back to `debug = true` for a session that genuinely
# needs lldb variable inspection.
# MEASURED on this repo (clean target dir, 2026-07-25), so nobody re-derives it:
# `cargo build` 1.5G → 1.2G; `cargo build + test --no-run` 3.5G → 2.7G. That is
# ~23% — real, but the SMALL lever. Prompt worktree removal is the big one.
# (`split-debuginfo` is deliberately NOT set: `unpacked` is already the macOS
# dev default — target/debug carries no .dSYM bundles — so pinning it would be
# noise, and Linux/wasm are better left on their own defaults.)
[profile.dev]
debug = "line-tables-only"

# Dependencies are optimized even in dev/test; awl itself is not. naga's
# WGSL->Metal shader translation runs on every `TextPipeline::new`, and at
# -O0 that cost 432ms a call — the dominant per-test cost in the render suite.
# MEASURED on this repo (2026-07-28): TextPipeline::new 432ms -> 77ms, full
# `cargo test` 531s -> 182s (3093 passed / 0 failed / 11 ignored, unchanged).
# awl's own crate stays unoptimized, so the incremental edit-rebuild loop stays
# in the same range (~4s). The cost is a one-time dependency rebuild per target
# dir — which every worktree pays separately, so a fleet of concurrent worktrees
# feels it most; `sccache` as RUSTC_WRAPPER shares those artifacts if that bites.
[profile.dev.package."*"]
opt-level = 3

# The native suite is dominated by awl's own test code rather than compilation.
# Level 1 cuts that runtime substantially without changing dev builds or taking
# level 2's observed correctness risk. Dependency optimization remains owned by
# the package override above.
[profile.test]
opt-level = 1

# The health gate owns this deliberately small extension to Clippy's defaults.
# These lints catch real mistakes here without prescribing a style or forcing
# architecture-scale rewrites of existing dispatch and capture seams.
[lints.clippy]
# A call inside `debug_assert!` VANISHES in release: the macro compiles out and
# takes the side effect with it. No suite can catch that — `cargo test` builds
# the dev profile, where the call is still there. Deny rather than warn: the
# failure is invisible until a user runs a release build.
debug_assert_with_mut_call = "deny"
# These are zero-debt lints: none existed when denied, so any future hit is a
# newly introduced correctness/debugging escape rather than historical style.
mem_forget = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
mutable_key_type = "deny"
# Prefer unwrap/unwrap_err in tests when the Result state itself is the claim:
# failures then print the unexpected value instead of only a boolean assertion.
assertions_on_result_states = "deny"
needless_borrow = "warn"
needless_borrows_for_generic_args = "warn"
unnecessary_to_owned = "warn"
if_same_then_else = "warn"
branches_sharing_code = "warn"

[dependencies]
anyhow = "1.0.102"
glyphon = "0.11.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
# Whole-document substring and line-ending scans. wasm keeps memchr's generic
# fallback because awl does not raise its browser floor to require simd128.
memchr = "2.8"
pollster = "0.4.0"
pulldown-cmark = { version = "0.12", default-features = false }
# LINE-ENDING MODEL (VS Code): the buffer is PURELY '\n'-based. We drop ropey's
# default `unicode_lines` (and its `cr_lines`) feature so the rope's line metrics
# (`len_lines`/`char_to_line`/`line_to_char`) recognize ONLY LF as a break — never
# CR, CRLF, NEL, LS or PS. CRLF is normalized to LF on load (see `Buffer::from_file`
# + `Eol`) so the rope never holds a '\r\n', and a lone '\r'/NEL/LS/PS stays literal
# CONTENT within its line (matching VS Code), which is exactly what LF-only counting
# gives. `simd` is kept for the index-math speedup. See the "Line endings" section
# of CLAUDE.md.
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
spellbook = "0.4.2"
toml = { version = "0.8", default-features = false, features = ["parse"] }
# UAX #29 extended grapheme cluster boundaries — the ONE owner of the caret's
# CHARACTER step (`src/grapheme.rs`), so `e`+U+0301 is one Right and one
# Backspace, exactly like precomposed U+00E9. This exact version is already
# locked in the graph through cosmic-text/rustybuzz, so making it direct adds no
# second segmentation table to the build.
unicode-segmentation = "1.13.3"
# `counters` arms wgpu-hal's live buffer/texture-view counters, which
# `src/gpu_alloc.rs` reads as the render suite's PORTABLE allocation oracle
# (item 249 — RSS grades the container, these grade the product). Off by default
# in wgpu and compiled out entirely when off, so the feature is not optional for
# the oracle to exist. Enabled for every build, not just tests: an oracle that
# lives in a different binary from the shipping one is the same mistake it was
# written to end. Cost is two relaxed atomics per GPU object create/destroy.
wgpu = { version = "=29.0.3", features = ["counters"] }
winit = "0.30"

# --- Native-only deps -------------------------------------------------------
# arboard (the OS clipboard) links platform clipboard backends (objc / X11 /
# windows) that DON'T compile for wasm32-unknown-unknown, and the browser
# clipboard is a different, async/permission-gated API anyway. So it is a
# native-only dependency; `app.rs` swaps in a no-op `Clipboard` stub on wasm
# (the editor runs on the internal kill-ring there). Native is untouched.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
accesskit = "0.24.1"
accesskit_winit = "0.33.2"
# wayland-data-control pulls in wl-clipboard-rs so arboard can talk to a pure
# Wayland compositor's data-control protocol (Hyprland, Sway, ...) — without
# it arboard defaults to X11-only on Linux and Clipboard::new() fails outright
# under a pure-Wayland session (no XWayland), silently degrading to the
# internal kill-ring mirror. macOS/Windows are unaffected (the feature only
# adds a Linux-only code path inside arboard).
arboard = { version = "3", features = ["wayland-data-control"] }
# Native PDF export reads the four bundled TrueType faces' cmap/metrics and
# embedding-permission bits. This exact parser version is already locked through
# cosmic-text/fontdb; making it direct adds no second parser to the graph.
ttf-parser = "0.25.1"
# WRITING STREAKS records each day under the user's LOCAL calendar day; std exposes
# no local-timezone offset, so the native recording engine reads `tm_gmtoff` via
# libc's `localtime_r` (see `app/streaks.rs`). Already present transitively in the
# graph (winit/arboard), so making it direct adds nothing to the build; native-only
# (the recording engine is native-only, like the daemon / session restore).
libc = "0.2"

# --- macOS-only dep ---------------------------------------------------------
# The DEBUG panel's live `gpu N MB` line reads Metal's
# `MTLDevice.currentAllocatedSize` off the raw device wgpu-hal hands back via
# `Device::as_hal::<Metal>()`. That handle is an `objc2-metal` `MTLDevice` protocol
# object, so we pull the SAME `objc2-metal` version wgpu-hal 29 uses (0.3.2) purely to
# bring the `MTLDevice` trait method into scope. Mac-only; Linux/Vulkan + wasm/WebGPU
# have no cheap query and show `gpu —`. (Cargo unifies this with wgpu-hal's own copy —
# same crate instance, no duplicate build.)
[target.'cfg(target_os = "macos")'.dependencies]
objc2-metal = { version = "0.3.2", default-features = false, features = ["MTLDevice"] }
# The native macOS MENU BAR (App/File/Edit/View/Window — `src/menu.rs`). muda
# is tauri's winit-compatible cross-platform menu crate; `default-features =
# false` drops its `libxdo`/`gtk` defaults, which are Linux-only optional deps
# that never build against a non-Linux target anyway but are disabled
# explicitly for a lean mac-only dependency graph. Mac-only for now (SCOPE:
# Linux/wasm never see a menu bar in v1 — muda supports gtk on Linux, but
# wiring it is left for a future round; wasm has no native chrome at all).
muda = { version = "0.19.3", default-features = false }
# Native macOS chrome for two MENU items that dodge the in-app overlay path:
# File "Open..." -> NSOpenPanel (the standard file picker) and About ->
# NSApplication's standard About panel. Both live ONLY behind
# `cfg(target_os = "macos")` in `src/mac_chrome.rs`; every other platform keeps
# the existing in-app behavior. Versions MATCH the copies muda 0.19.3 already
# unifies into the graph (objc2 0.6, objc2-app-kit/-foundation 0.3.2), so Cargo
# builds one instance - no duplicate objc2 stack.
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSApplication",
    # The standard About panel's credits are an attributed string with a
    # centred paragraph style; name those AppKit capabilities explicitly.
    "NSAttributedString",
    "NSParagraphStyle",
    "NSText",
    "NSResponder",
    "NSPanel",
    "NSWindow",
    "NSSavePanel",
    "NSOpenPanel",
    # SF-Symbol -> RGBA rasterization for the menu icons (`menu_icons.rs`, via
    # `mac_chrome::render_symbol_rgba`): NSImage (+ its NSImageSymbolConfiguration),
    # the NSImageRep/NSBitmapImageRep backing store, an NSGraphicsContext to draw
    # into it, NSGraphics for `drawInRect:` + the color-space-name/compositing
    # constants, NSFontDescriptor for the symbol weight, and objc2-core-foundation
    # for CGFloat/geometry.
    "NSImage",
    "NSImageRep",
    "NSBitmapImageRep",
    "NSGraphicsContext",
    "NSGraphics",
    "NSFontDescriptor",
    "objc2-core-foundation",
    # Walking the installed menu bar's real NSMenu/NSMenuItem tree to mark each
    # routed icon's NSImage a TEMPLATE image (`mac_chrome::mark_menu_icons_as_templates`,
    # called right after `crate::menu::install`'s `Menu::init_for_nsapp()`) — so
    # AppKit tints the icon to the current appearance's label ink (and the
    # correct on-highlight tint) instead of a fixed pre-baked gray. `NSMenu`
    # brings `NSApplication::mainMenu`/`itemArray` into scope too (both are
    # `#[cfg(feature = "NSMenu")]`-gated in objc2-app-kit).
    "NSMenu",
    "NSMenuItem",
    # ACCESSIBILITY TIER 1 (`motion.rs`'s `mac_chrome::system_reduce_motion`):
    # `NSWorkspace.accessibilityDisplayShouldReduceMotion` — the OS-level
    # Reduce Motion preference, consulted ONCE at live startup (never in a
    # headless capture) to seed the `motion::reduced()` process-global. The
    # method lives in objc2-app-kit's own separately-gated "NSAccessibility"
    # category module (not just "NSWorkspace" — both are required).
    "NSWorkspace",
    "NSAccessibility",
    # THE CUSTOM ABOUT WINDOW (`src/mac_about/`): a real `NSPanel` subclass
    # whose content view is hand-laid AppKit views — `NSView` (the content
    # canvas), `NSTextField` (every label, via `labelWithString:`) and its
    # `NSControl` superclass (alignment/font), `NSImageView` (the shipped app
    # icon at real scale), `NSBox` (the hairline rule, `NSBoxType::Separator`),
    # `NSButton` + `NSButtonCell` (the two link buttons and `NSBezelStyle`),
    # `NSFont`/`NSColor` (the semantic type ramp and label inks that make the
    # panel correct in BOTH light and dark appearances), and `NSEvent` for the
    # `performKeyEquivalent:` override that closes the panel on Cmd-W.
    "NSView",
    "NSControl",
    "NSTextField",
    "NSImageView",
    "NSBox",
    "NSButton",
    "NSButtonCell",
    "NSFont",
    "NSColor",
    "NSEvent",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSString",
    "NSRange",
    "NSURL",
    "NSDictionary",
    "NSAttributedString",
    "NSObject",
    # NSRect/NSPoint/NSSize (+ CGFloat) for the symbol-rasterization draw rect.
    "NSGeometry",
    # PER-WORLD APP ICON (item 92, `mac_chrome::set_dock_icon`): the active
    # world's pre-rendered `.icns` is handed to `NSImage(data:)` as an NSData,
    # which then feeds `NSApplication.setApplicationIconImage:`. Already enabled
    # in practice — objc2-app-kit's own "NSImage" feature (above) turns
    # `objc2-foundation/NSData` on and Cargo unifies the two — so listing it
    # here changes NOTHING about the built feature set; it just makes the edge
    # we actually depend on explicit instead of incidental.
    "NSData",
    # NSFileManager `trashItemAtURL:resultingItemURL:error:` — the RECOVERABLE
    # delete the Asset Cleaner routes through (`mac_chrome::trash_path`); NSError
    # carries the failure message. Already-in-tree door, no new crate.
    "NSFileManager",
    "NSError",
    # THE ABOUT WINDOW'S PACKAGED FACTS (`src/mac_about/facts.rs`):
    # `NSBundle.mainBundle().objectForInfoDictionaryKey:` reads the REAL
    # `CFBundleShortVersionString`/`CFBundleVersion` that
    # `scripts/package-macos.sh` wrote into `Info.plist`. Outside a bundle
    # there is no dictionary, the lookups answer `None`, and the window falls
    # back to the compile-time crate version — never to an invented string.
    "NSBundle",
    "objc2-core-foundation",
] }

# --- wasm (browser) deps ----------------------------------------------------
# Only pulled in for the wasm32 target, so the native build is byte-identical.
# wgpu gains its WebGL fallback backend here (WebGPU isn't universal yet); the
# bindgen/web-sys/console crates wire the canvas, panic hook, and logging; and
# web-time supplies a browser `Instant`/`SystemTime` (std's panics on wasm).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "=29.0.3", features = ["webgl", "counters"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
console_log = "1"
log = "0.4"
web-time = "1"
# Explicit direct dep (was already transitive via wasm-bindgen/web-sys at the
# identical locked version): the WEB ESCAPE HATCHES round's "Download file"
# command builds a plain JS `Array` of Blob parts (`web_export.rs`).
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "HtmlCanvasElement",
    "Storage",
    "Navigator",
    # ACCESSIBILITY TIER 1 (`motion.rs`): `window.matchMedia("(prefers-reduced-
    # motion: reduce)")` — the `auto` half of the web build's config→OS reduce-
    # motion ladder, read ONCE at `wasm_start`.
    "MediaQueryList",
    # WEB ESCAPE HATCHES round (`web_export.rs` — "Download file"; `app.rs`'s
    # `sync_kill_to_clipboard`/`refresh_kill_from_clipboard` async mirror):
    # Blob + object-URL + synthetic `<a download>` click, and the browser
    # Clipboard API (`navigator.clipboard.writeText`/`readText`).
    "Blob",
    "BlobPropertyBag",
    "Url",
    "HtmlAnchorElement",
    "Clipboard",
    "Permissions",
    "PermissionStatus",
    "PermissionState",
] }

[dev-dependencies]
# PNG decode for the RENDERED-PIXEL frost regression (`tests/frost_rail_pixels.rs`,
# the appearance-oracle guard CLAUDE.md's tripwire demands). Same version + feature
# set as the runtime `image` dependency above, so no extra crate is compiled — a
# dev-dep is simply how an integration test (separate crate) reaches the decoder.
image = { version = "0.25.10", default-features = false, features = ["png"] }
# WGSL->GLSL ES 300 (WebGL2) offline shader validation for the DITHER round's
# shader changes (`render::tests::webgl_shader_validation`) — same naga
# version wgpu 29.0.3 already pulls in transitively, pinned exact so this
# never drifts from what actually ships. dev-only; not a runtime dependency.
naga = { version = "=29.0.3", features = ["wgsl-in", "glsl-out"] }
# The wasm32 core smoke suite (src/websmoke.rs). Compatible with the pinned
# wasm-bindgen 0.2.121; used only under `#[cfg(all(test, target_arch = "wasm32"))]`.
wasm-bindgen-test = "0.3"
# The shared layer BOTH platform accessibility backends compute their exposed
# tree with: `accesskit_macos` and `accesskit_atspi_common` each re-export
# `accesskit_consumer::common_filter` as their own `filter`. Same version
# accesskit_winit 0.33.2 already pulls in transitively, pinned exact so the law
# can never drift from what actually ships. dev-only; not a runtime dependency.
# It exists so a claim about what a screen reader SEES is measured against that
# code rather than read off it — no local gate reaches AT-SPI or VoiceOver.
accesskit_consumer = "=0.38.0"
