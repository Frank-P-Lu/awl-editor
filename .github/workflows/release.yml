name: release

# Cuts a GitHub Release. Builds three things — a macOS universal (.app +
# .dmg), a Linux tar.gz, and a zipped web (trunk) bundle — and publishes one
# of them; see WHAT A TAG PUBLISHES TODAY below.
#
# Triggers:
#   - push of a `v*` tag        -> real release, artifacts attached to the tag's GH Release
#   - workflow_dispatch          -> manual run, with a `dry_run` input
#
# dry_run (default true on manual dispatch): when true, OR when the run was
# NOT triggered by a tag push, every job builds and uploads its artifacts as
# a plain workflow-run artifact (Actions "Artifacts" tab) instead of
# attaching to a GitHub Release — so you can green-check the whole pipeline
# with zero tags and zero releases created. Signing/notarizing on the mac
# job is independently gated on its own secrets (see below) — a dry run
# with no signing secrets configured produces an UNSIGNED .app + .dmg, which
# is the expected, fully-testable-today path.
#
# WHAT A TAG PUBLISHES TODAY: Linux only. The mac and web jobs build on a
# DRY RUN — that is what keeps the whole pipeline honest — and are skipped
# on a tag, so an unsigned .app can never reach a public Release by
# accident. macOS ships when Apple signing + notarization are configured
# (RELEASING.md §1); the web build ships as the live site via
# deploy-web.yml, not as a download. Flip both `if:` conditions and the
# publish job's `needs`/`files` together when that changes.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip GitHub Release attach; upload as workflow artifacts instead)"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# The repository's default workflow permission is READ. Every build job is
# happy with that; the publish job raises `contents: write` for itself alone,
# which is the token scope `softprops/action-gh-release` needs to create the
# Release. Without it a tag push builds everything and then 403s on the last
# step — a failure no dry run can surface, because dry runs skip publish.
permissions:
  contents: read

jobs:
  # Single source of truth for "is this a real release" so every job (and
  # the final publish step) agrees.
  #
  # Note what this does NOT read: the `dry_run` input. Only a `v*` TAG PUSH
  # can ever set is_release, so `-f dry_run=false` on a manual dispatch is
  # inert — a manual run cannot publish, whatever the box says. That is the
  # safety property, kept deliberately; the input survives as documentation
  # of intent.
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.plan.outputs.is_release }}
      version: ${{ steps.plan.outputs.version }}
      # Pre-1.0 is a beta, marked prerelease on the GitHub Release — the
      # rule is "major version 0", the same discriminator a v1.0.0 launch
      # flips by construction. Computed from the tag's own version rather
      # than hand-set per release, so the flag can't drift from the version
      # string it describes.
      is_prerelease: ${{ steps.plan.outputs.is_prerelease }}
    steps:
      - id: plan
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            MAJOR="${VERSION%%.*}"
            if [ "$MAJOR" -lt 1 ] 2>/dev/null; then
              echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "version=0.0.0-dryrun" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          fi

  mac:
    name: mac (universal .app + .dmg)
    needs: plan
    # Dry runs only — see the header. A tag must not produce an unsigned .app.
    if: needs.plan.outputs.is_release != 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-mac

      # .cargo/config.toml sets `rustc-wrapper = "sccache"` for every build in
      # this checkout, so the wrapper has to exist before the first cargo
      # invocation or it dies on `rustc -vV` with "could not execute process
      # sccache (never executed)". Installed after the cache restore, exactly
      # as ci.yml does it.
      - name: Install sccache
        run: scripts/install-sccache.sh

      # with-remap.sh strips the runner's $HOME/registry paths from the shipped
      # release binary (rustc bakes compile-time source locations otherwise).
      - name: cargo build --release (aarch64-apple-darwin)
        run: scripts/with-remap.sh cargo build --release --target aarch64-apple-darwin

      - name: cargo build --release (x86_64-apple-darwin)
        run: scripts/with-remap.sh cargo build --release --target x86_64-apple-darwin

      - name: lipo into a universal binary
        run: |
          mkdir -p target/universal
          lipo -create -output target/universal/awl \
            target/aarch64-apple-darwin/release/awl \
            target/x86_64-apple-darwin/release/awl
          lipo -info target/universal/awl

      # Self-diagnostic for the "hdiutil: create failed - No space left on
      # device" class of failure (GitHub mac runners' system temp volume has
      # been observed nearly full while the workspace volume has headroom —
      # see package-macos.sh's own "--reclaim" doc note for the full story).
      # Printed before packaging so any future failure carries the numbers.
      - name: Disk space before packaging
        run: df -h

      - name: Assemble Awl.app (+ .dmg)
        env:
          AWL_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          mkdir -p dist-mac
          scripts/package-macos.sh --reclaim target/universal/awl dist-mac

      # --- Signing + notarization: GATED on secrets existing --------------
      # Required secrets (all-or-nothing — see RELEASING.md "Apple setup"):
      #   MACOS_CERT_P12       base64-encoded Developer ID Application .p12
      #   MACOS_CERT_PASSWORD  that .p12's export password
      #   APPLE_API_KEY_ID     App Store Connect API key id
      #   APPLE_API_ISSUER     App Store Connect API issuer id
      #   APPLE_API_KEY_B64    base64-encoded .p8 API key file
      # Without them (or on a dry run) every step below SKIPS with a loud
      # log line, and the job still produces an UNSIGNED .app + .dmg — the
      # pipeline stays fully testable with no Apple developer account.
      - name: Check signing secrets
        id: signing
        run: |
          if [ -n "${{ secrets.MACOS_CERT_P12 }}" ] && [ -n "${{ secrets.MACOS_CERT_PASSWORD }}" ] && \
             [ -n "${{ secrets.APPLE_API_KEY_ID }}" ] && [ -n "${{ secrets.APPLE_API_ISSUER }}" ] && \
             [ -n "${{ secrets.APPLE_API_KEY_B64 }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Signing secrets not fully configured (need MACOS_CERT_P12, MACOS_CERT_PASSWORD, APPLE_API_KEY_ID, APPLE_API_ISSUER, APPLE_API_KEY_B64) — skipping codesign/notarize. Producing an UNSIGNED .app + .dmg. See RELEASING.md 'Apple setup'."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import signing certificate to a temp keychain
        if: steps.signing.outputs.available == 'true' && needs.plan.outputs.is_release == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/awl-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # shellcheck disable=SC2046  # intentional word-splitting: re-list every existing keychain plus the new one
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: codesign Awl.app
        if: steps.signing.outputs.available == 'true' && needs.plan.outputs.is_release == 'true'
        run: |
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity found in the imported certificate."
            exit 1
          fi
          codesign --deep --force --options runtime --sign "$IDENTITY" "dist-mac/Awl.app"
          codesign --verify --deep --strict --verbose=2 "dist-mac/Awl.app"

      - name: notarytool submit + staple
        if: steps.signing.outputs.available == 'true' && needs.plan.outputs.is_release == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
        run: |
          echo "$APPLE_API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent "dist-mac/Awl.app" "$RUNNER_TEMP/Awl-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Awl-notarize.zip" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "dist-mac/Awl.app"
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/Awl-notarize.zip"

      - name: Re-create Awl.dmg (post-sign/staple)
        if: steps.signing.outputs.available == 'true' && needs.plan.outputs.is_release == 'true'
        run: |
          df -h
          # Same hardening as package-macos.sh's own DMG step (see its
          # module doc for the full story): stage under dist-mac/
          # (workspace-relative) rather than the system mktemp -d/$TMPDIR
          # default, point hdiutil's own scratch work at a workspace-local
          # TMPDIR, and — the confirmed actual fix — pass an explicit
          # `-size` computed from the staged folder's APPARENT byte size
          # (`stat -f%z`, not `du`) so hdiutil's own sparse-aware auto-size
          # estimate can never undersize the scratch image against a
          # `lipo`-produced (potentially sparse) universal binary.
          AWL_SKIP_DMG=0 bash -c '
            rm -f dist-mac/Awl.dmg
            WORK="dist-mac/.dmg-restage"
            rm -rf "$WORK"
            mkdir -p "$WORK/staging" "$WORK/tmp"
            cp -R dist-mac/Awl.app "$WORK/staging/"
            ln -s /Applications "$WORK/staging/Applications"
            APPARENT_BYTES="$(find "$WORK/staging" -type f -exec stat -f%z {} + | awk "{sum+=\$1} END{print sum+0}")"
            DMG_SIZE_MB=$(( (APPARENT_BYTES * 2 / 1024 / 1024) + 64 ))
            echo "==> sizing DMG scratch image: ${DMG_SIZE_MB}m (from ${APPARENT_BYTES} apparent bytes staged)"
            TMPDIR="$PWD/$WORK/tmp" hdiutil create -volname "Awl" -srcfolder "$WORK/staging" -size "${DMG_SIZE_MB}m" -ov -format UDZO dist-mac/Awl.dmg
            rm -rf "$WORK"
          '

      - name: Zip Awl.app (for artifact upload)
        run: ditto -c -k --keepParent dist-mac/Awl.app dist-mac/Awl-macos-universal.app.zip

      - uses: actions/upload-artifact@v7
        with:
          name: awl-macos
          path: |
            dist-mac/Awl-macos-universal.app.zip
            dist-mac/Awl.dmg
          retention-days: 14

  linux:
    name: linux (release tar.gz)
    needs: plan
    # THE GLIBC FLOOR IS SET HERE AND NOWHERE ELSE — whichever image builds
    # this job decides which systems can run the download. `ubuntu-latest`
    # (24.04, glibc 2.39) excluded Debian 12, Ubuntu 22.04 LTS and RHEL 9 over
    # exactly TWO weak, optional symbols — `pidfd_spawnp` and `pidfd_getpid`,
    # Rust std's internal pidfd fast path for reaping a child it already
    # spawned. awl never touches PidFd APIs and every `Command` here blocks on
    # `.output()`/`.wait()`, so std's fork/exec fallback costs nothing
    # observable. Measured, not reasoned: binaries built on debian:bookworm
    # and ubuntu:22.04 both cap at GLIBC_2.35 and render byte-identical PNGs.
    # Sub-2.39 glibc does not export those two symbols at all, which is why
    # the reference cannot reappear by accident.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Same apt-get list as ci.yml's linux job.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libfontconfig1-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            mesa-vulkan-drivers

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux

      # See the mac job's copy of this step for why it is not optional.
      - name: Install sccache
        run: scripts/install-sccache.sh

      # Build the debug half consumed by the profile differential below.
      - name: cargo build
        run: cargo build

      # with-remap.sh strips the runner's $HOME/registry paths from the shipped
      # release binary (rustc bakes compile-time source locations otherwise).
      - name: cargo build --release
        run: scripts/with-remap.sh cargo build --release

      # Release artifacts must cross the same differential state law as a main
      # push. This is headless and parallel-safe; live-window probes remain a
      # separate pre-tag/human tier.
      - name: Debug/release sidecar parity
        run: scripts/release-profile-gate.sh --use-built-binaries

      # One owner for the archive layout, the licence set and the checksum,
      # runnable locally against any Linux build — the eight inline `cp`
      # lines this replaced could only be exercised by pushing to CI, and
      # their `2>/dev/null || true` would have shipped a tarball with no
      # LICENSE in it without failing.
      - name: Package tar.gz + checksum
        env:
          AWL_VERSION: ${{ needs.plan.outputs.version }}
        run: scripts/package-linux.sh target/release/awl dist-linux

      - uses: actions/upload-artifact@v7
        with:
          name: awl-linux
          path: |
            dist-linux/awl-${{ needs.plan.outputs.version }}-linux-x86_64.tar.gz
            dist-linux/awl-${{ needs.plan.outputs.version }}-linux-x86_64.tar.gz.sha256
          retention-days: 14

  web:
    name: web (trunk dist, zipped)
    needs: plan
    # Dry runs only — see the header. The web build ships as the live site.
    if: needs.plan.outputs.is_release != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-web

      # See the mac job's copy of this step for why it is not optional.
      - name: Install sccache
        run: scripts/install-sccache.sh

      - name: Install wasm-bindgen-cli + trunk
        run: |
          cargo install wasm-bindgen-cli --version 0.2.121 --locked
          cargo install trunk --locked

      # with-remap.sh strips the builder's $HOME/registry paths from the wasm
      # (rustc bakes compile-time source locations); this bundle is released.
      - name: trunk build --release
        run: scripts/with-remap.sh trunk build --release

      # The same licence set the Linux tarball carries, including the two
      # bundled-asset audits — the fonts and dictionaries are compiled into
      # the wasm exactly as they are into the native binary.
      - name: Zip dist/
        run: |
          mkdir -p dist-web dist/licenses
          cp LICENSE NOTICE CREDITS.md THIRD-PARTY-LICENSES.md dist/
          cp assets/fonts/LICENSES.md dist/licenses/fonts-LICENSES.md
          cp assets/dict/LICENSES.md dist/licenses/dict-LICENSES.md
          (cd dist && zip -r ../dist-web/awl-web-dist.zip .)

      - uses: actions/upload-artifact@v7
        with:
          name: awl-web
          path: dist-web/awl-web-dist.zip
          retention-days: 14

  publish:
    name: publish GitHub Release
    # Linux only — the mac and web jobs do not run on a tag at all, so they
    # cannot be depended on here and cannot be attached by accident.
    needs: [plan, linux]
    if: needs.plan.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # SHA256SUMS covers exactly the files about to be attached, computed
      # from the artifacts themselves rather than transcribed. `sha256sum -c
      # SHA256SUMS` in the download directory is the whole verification.
      - name: Build the checksum manifest
        env:
          TARBALL: awl-${{ needs.plan.outputs.version }}-linux-x86_64.tar.gz
        run: |
          mkdir -p release
          cp "artifacts/awl-linux/$TARBALL" release/
          (cd release && sha256sum "$TARBALL" > SHA256SUMS)
          cat release/SHA256SUMS

      # The release body IS the install page — a reader arrives here from the
      # site's Download link and must not have to guess. `body` (not
      # `body_path`) keeps it beside the file list it describes;
      # `fail_on_unmatched_files` is the difference between a failed run and a
      # published Release with nothing attached to it. `prerelease` is the
      # ONLY thing on this step that is not a version string but must still
      # track the version: pre-1.0 publishes marked prerelease, computed
      # once in `plan` from the same tag so it can't disagree with the
      # version above it.
      - name: softprops/action-gh-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.plan.outputs.version }}
          prerelease: ${{ needs.plan.outputs.is_prerelease }}
          fail_on_unmatched_files: true
          body: |
            **Linux x86_64.** macOS builds from source until Apple signing and
            notarization are in place; Windows uses the web editor.

            ```sh
            sha256sum -c SHA256SUMS
            tar xzf awl-${{ needs.plan.outputs.version }}-linux-x86_64.tar.gz
            cd awl-${{ needs.plan.outputs.version }}-linux-x86_64
            ./awl notes.md
            ```

            The archive unpacks into one directory and installs nothing. Put it
            on your PATH with `install -Dm755 awl ~/.local/bin/awl`.

            awl needs a working Vulkan driver, fontconfig, libxkbcommon, and
            Wayland or X11. `README.txt` inside the archive lists the package
            names per distro; `GLIBC.txt` records the glibc version this build
            requires. Fonts and dictionaries are compiled in — awl never
            fetches anything at runtime.

            GPL-3.0-only. `LICENSE`, `NOTICE`, `CREDITS.md`,
            `THIRD-PARTY-LICENSES.md` and `licenses/` ride inside the archive.
          files: |
            release/awl-${{ needs.plan.outputs.version }}-linux-x86_64.tar.gz
            release/SHA256SUMS
