name: release

# Manual dispatch uses hosted builders and explicit preview/stable selection.
# dry_run=true is nonpublishing; signing additionally requires explicit opt-in.
# Legacy v-tag/local staging remains a fallback until hosted signing is proven.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rehearse only (false deliberately publishes the selected channel from main)"
        type: boolean
        default: true
      channel:
        description: "Release channel (preview marks a prerelease; stable marks a full release)"
        type: choice
        options: [preview, stable]
        default: preview
      credentialed_macos_rehearsal:
        description: "Sign and notarize macOS during this nonpublishing manual run"
        type: boolean
        default: false

      local_macos_rehearsal:
        description: "Validate the locally signed staged Mac DMGs without publishing"
        type: boolean
        default: false

concurrency:
  group: release-pipeline
  cancel-in-progress: false

# The repository's default workflow permission is READ. Every build job is
# happy with that; the publish job raises `contents: write` for itself alone,
# which is the token scope `softprops/action-gh-release` needs to create the
# Release. Without it a tag push builds everything and then 403s on the last
# step — a failure no dry run can surface, because dry runs skip publish.
permissions:
  contents: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.plan.outputs.is_release }}
      version: ${{ steps.plan.outputs.version }}
      sign_macos: ${{ steps.plan.outputs.sign_macos }}
      local_macos: ${{ steps.plan.outputs.local_macos }}
      is_prerelease: ${{ steps.plan.outputs.is_prerelease }}
      channel: ${{ steps.plan.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        run: python3 scripts/release-plan.py plan

  checks:
    name: Exact source correctness
    needs: plan
    uses: ./.github/workflows/ci.yml

  extended:
    name: Pre-release journeys
    needs: plan
    uses: ./.github/workflows/extended-verification.yml
    with:
      mode: pre-release

  mac:
    name: mac (arm64 + x86_64 .apps + .dmgs)
    if: needs.plan.outputs.local_macos != 'true'
    needs: [plan, checks, extended]
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/project-rust
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-mac

      # .cargo/config.toml sets `rustc-wrapper = "sccache"` for every build in
      # this checkout, so the wrapper has to exist before the first cargo
      # invocation or it dies on `rustc -vV` with "could not execute process
      # sccache (never executed)". Installed after the cache restore, exactly
      # as ci.yml does it.
      - name: Install sccache
        run: scripts/install-sccache.sh

      # with-remap.sh strips the runner's $HOME/registry paths from the shipped
      # release binary (rustc bakes compile-time source locations otherwise).
      - name: cargo build --release (aarch64-apple-darwin)
        run: scripts/with-remap.sh cargo build --release --target aarch64-apple-darwin

      - name: cargo build --release (x86_64-apple-darwin)
        run: scripts/with-remap.sh cargo build --release --target x86_64-apple-darwin

      # Self-diagnostic for the "hdiutil: create failed - No space left on
      # device" class of failure (GitHub mac runners' system temp volume has
      # been observed nearly full while the workspace volume has headroom —
      # see package-macos.sh's own "--reclaim" doc note for the full story).
      # Printed before packaging so any future failure carries the numbers.
      - name: Disk space before packaging
        run: df -h

      - name: Assemble architecture-specific Awl.app bundles
        env:
          AWL_VERSION: ${{ needs.plan.outputs.version }}
          AWL_SOURCE_COMMIT: ${{ github.sha }}
          AWL_BUILD_VERSION: ${{ github.run_number }}.0.0
        run: |
          mkdir -p dist-mac/arm64 dist-mac/x86_64
          AWL_SKIP_DMG=1 scripts/package-macos.sh --reclaim \
            target/aarch64-apple-darwin/release/awl dist-mac/arm64
          AWL_SKIP_DMG=1 scripts/package-macos.sh \
            target/x86_64-apple-darwin/release/awl dist-mac/x86_64
          scripts/package-macos.sh --verify dist-mac/arm64/Awl.app arm64
          scripts/package-macos.sh --verify dist-mac/x86_64/Awl.app x86_64

      # --- Signing + notarization: GATED on secrets existing --------------
      # Required secrets (all-or-nothing — see RELEASING.md "Apple setup"):
      #   MACOS_CERT_P12       base64-encoded Developer ID Application .p12
      #   MACOS_CERT_PASSWORD  that .p12's export password
      #   APPLE_API_KEY_ID     App Store Connect API key id
      #   APPLE_API_ISSUER     App Store Connect API issuer id
      #   APPLE_API_KEY_B64    base64-encoded .p8 API key file
      # Publication and credentialed rehearsals fail closed when any credential
      # is missing. The default nonpublishing rehearsal remains unsigned.
      - name: Check signing secrets
        id: signing
        env:
          SIGN_MACOS: ${{ needs.plan.outputs.sign_macos }}
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
        run: |
          missing=""
          [ -n "$MACOS_CERT_P12" ] || missing="$missing MACOS_CERT_P12"
          [ -n "$MACOS_CERT_PASSWORD" ] || missing="$missing MACOS_CERT_PASSWORD"
          [ -n "$APPLE_API_KEY_ID" ] || missing="$missing APPLE_API_KEY_ID"
          [ -n "$APPLE_API_ISSUER" ] || missing="$missing APPLE_API_ISSUER"
          [ -n "$APPLE_API_KEY_B64" ] || missing="$missing APPLE_API_KEY_B64"
          if [ -z "$missing" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            if [ "$SIGN_MACOS" = "true" ]; then
              echo "::error::macOS signing is required, but these credentials are missing:$missing"
              exit 1
            fi
            echo "Unsigned nonpublishing macOS dry run (credentialed rehearsal not requested)."
          fi

      - name: Import signing certificate to a temp keychain
        if: needs.plan.outputs.sign_macos == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          umask 077
          KEYCHAIN_PATH="$RUNNER_TEMP/awl-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          trap 'rm -f "$RUNNER_TEMP/cert.p12"' EXIT
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # shellcheck disable=SC2046  # intentional word-splitting: re-list every existing keychain plus the new one
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: codesign Awl.app
        if: needs.plan.outputs.sign_macos == 'true'
        run: |
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity found in the imported certificate."
            exit 1
          fi
          for ARCH in arm64 x86_64; do
            codesign --force --options runtime --timestamp --sign "$IDENTITY" "dist-mac/$ARCH/Awl.app"
            codesign --verify --deep --strict --verbose=2 "dist-mac/$ARCH/Awl.app"
          done

      - name: notarytool submit + staple
        if: needs.plan.outputs.sign_macos == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
        run: |
          umask 077
          trap 'rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP"/Awl-notarize-*.zip "$RUNNER_TEMP"/notary-result-*.json' EXIT
          echo "$APPLE_API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          for ARCH in arm64 x86_64; do
            APP="dist-mac/$ARCH/Awl.app"
            ZIP="$RUNNER_TEMP/Awl-notarize-$ARCH.zip"
            RESULT="$RUNNER_TEMP/notary-result-$ARCH.json"
            ditto -c -k --keepParent "$APP" "$ZIP"
            xcrun notarytool submit "$ZIP" \
              --key "$RUNNER_TEMP/AuthKey.p8" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" \
              --wait --output-format json > "$RESULT"
            STATUS="$(plutil -extract status raw -o - "$RESULT")"
            if [ "$STATUS" != "Accepted" ]; then
              echo "::error::$ARCH notarization status was '$STATUS', expected 'Accepted'."
              cat "$RESULT"
              exit 1
            fi
            xcrun stapler staple "$APP"
            xcrun stapler validate "$APP"
            spctl --assess --type execute --verbose=4 "$APP"
          done

      - name: Create versioned architecture-specific DMGs
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          df -h
          for ARCH in arm64 x86_64; do
            scripts/package-macos.sh --dmg-only \
              "dist-mac/$ARCH/Awl.app" \
              "dist-mac/awl-$VERSION-macos-$ARCH.dmg" \
              "$ARCH"
          done

      - name: Validate and checksum macOS artifacts
        env:
          SIGN_MACOS: ${{ needs.plan.outputs.sign_macos }}
          VERSION: ${{ needs.plan.outputs.version }}
          BUILD_VERSION: ${{ github.run_number }}.0.0
        run: |
          if [ "$SIGN_MACOS" = true ]; then POLICY=signed; else POLICY=unsigned; fi
          RECEIPTS="$(mktemp -d "$RUNNER_TEMP/awl-mac-verification.XXXXXX")"
          trap 'rm -rf "$RECEIPTS"' EXIT
          scripts/verify-macos-release.sh dist-mac "$VERSION" "$BUILD_VERSION" "$POLICY" ci "$RECEIPTS"
          python3 scripts/macos-verification-receipt.py check \
            --receipt-dir "$RECEIPTS" --dist dist-mac --version "$VERSION" \
            --build-version "$BUILD_VERSION" --source "$(git rev-parse HEAD)" \
            --signing "$POLICY" --launch ci

      - uses: actions/upload-artifact@v7
        with:
          name: awl-macos
          path: |
            dist-mac/awl-${{ needs.plan.outputs.version }}-macos-arm64.dmg
            dist-mac/awl-${{ needs.plan.outputs.version }}-macos-arm64.dmg.sha256
            dist-mac/awl-${{ needs.plan.outputs.version }}-macos-arm64.app.zip
            dist-mac/awl-${{ needs.plan.outputs.version }}-macos-arm64.app.zip.sha256
            dist-mac/awl-${{ needs.plan.outputs.version }}-macos-x86_64.dmg
            dist-mac/awl-${{ needs.plan.outputs.version }}-macos-x86_64.dmg.sha256
            dist-mac/awl-${{ needs.plan.outputs.version }}-macos-x86_64.app.zip
            dist-mac/awl-${{ needs.plan.outputs.version }}-macos-x86_64.app.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing keychain
        if: always() && needs.plan.outputs.sign_macos == 'true'
        run: |
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP"/Awl-notarize-*.zip "$RUNNER_TEMP"/notary-result-*.json
          security delete-keychain "$RUNNER_TEMP/awl-signing.keychain-db" 2>/dev/null || true

  mac-staged:
    name: mac (verify locally signed downloads)
    needs: [plan, checks, extended]
    if: needs.plan.outputs.local_macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    # GitHub draft releases require push visibility. This ephemeral token is
    # confined to this consumer job; no Apple credentials leave the owner Mac.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fetch exact locally signed candidate
        id: staged
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: python3 scripts/staged-macos-release.py fetch --repo "$GITHUB_REPOSITORY" --directory dist-mac --version "$VERSION"

      - name: Independently validate actual staged DMGs
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          BUILD_VERSION: ${{ steps.staged.outputs.build_version }}
        run: |
          RECEIPTS="$(mktemp -d "$RUNNER_TEMP/awl-mac-verification.XXXXXX")"
          trap 'rm -rf "$RECEIPTS"' EXIT
          scripts/verify-macos-release.sh dist-mac "$VERSION" "$BUILD_VERSION" signed ci "$RECEIPTS"
          python3 scripts/macos-verification-receipt.py check \
            --receipt-dir "$RECEIPTS" --dist dist-mac --version "$VERSION" \
            --build-version "$BUILD_VERSION" --source "$(git rev-parse HEAD)" \
            --signing signed --launch ci

      - uses: actions/upload-artifact@v7
        with:
          name: awl-macos
          path: |
            dist-mac/*.dmg
            dist-mac/*.dmg.sha256
            dist-mac/*.app.zip
            dist-mac/*.app.zip.sha256
          if-no-files-found: error
          retention-days: 14

  linux:
    name: linux (release tar.gz)
    needs: [plan, checks, extended]
    # THE GLIBC FLOOR IS SET HERE AND NOWHERE ELSE — whichever image builds
    # this job decides which systems can run the download. `ubuntu-latest`
    # (24.04, glibc 2.39) excluded Debian 12, Ubuntu 22.04 LTS and RHEL 9 over
    # exactly TWO weak, optional symbols — `pidfd_spawnp` and `pidfd_getpid`,
    # Rust std's internal pidfd fast path for reaping a child it already
    # spawned. awl never touches PidFd APIs and every `Command` here blocks on
    # `.output()`/`.wait()`, so std's fork/exec fallback costs nothing
    # observable. Measured, not reasoned: binaries built on debian:bookworm
    # and ubuntu:22.04 both cap at GLIBC_2.35 and render byte-identical PNGs.
    # Sub-2.39 glibc does not export those two symbols at all, which is why
    # the reference cannot reappear by accident.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # THE SAME list as ci.yml's linux job, and now by construction rather
      # than by a comment claiming it. This is the RELEASE build (RELEASING.md
      # §"Which Linux build is the release build"), so a dependency added for
      # the tested build and missed here would go green in CI and fail — or
      # worse, silently ship differently — only on a tag. scripts/linux-deps.sh
      # is the one owner; linux-deps-law.sh keeps it the only one.
      - name: Install system dependencies
        run: scripts/linux-build-deps.sh --timeout 5m run xvfb xauth

      - uses: ./.github/actions/project-rust

      # THE KEY CARRIES THE IMAGE, NOT JUST THE OS. `Swatinem/rust-cache`
      # mixes `runner.os` into its key, which is the string "Linux" for BOTH
      # ubuntu-24.04 and ubuntu-22.04 — so a cache filled on 24.04 restores
      # onto 22.04 and the build dies loading a proc-macro .so built against
      # the newer glibc (`libzvariant_derive…so: version GLIBC_2.39 not
      # found`). `ImageOS` (ubuntu22 / ubuntu24) is what actually
      # distinguishes them, and deriving it means a future `runs-on` change
      # re-keys the cache by itself rather than waiting for someone to
      # remember this line.
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux-${{ env.ImageOS }}

      # See the mac job's copy of this step for why it is not optional.
      - name: Install sccache
        run: scripts/install-sccache.sh

      # Build the debug half consumed by the profile differential below.
      - name: cargo build
        run: cargo build

      # with-remap.sh strips the runner's $HOME/registry paths from the shipped
      # release binary (rustc bakes compile-time source locations otherwise).
      - name: cargo build --release
        run: scripts/with-remap.sh cargo build --release

      # Release artifacts must cross the same differential state law as a main
      # push. This is headless and parallel-safe; live-window probes remain a
      # separate pre-tag/human tier.
      - name: Debug/release sidecar parity
        run: scripts/release-profile-gate.sh --use-built-binaries

      # One owner for the archive layout, the licence set and the checksum,
      # runnable locally against any Linux build — the eight inline `cp`
      # lines this replaced could only be exercised by pushing to CI, and
      # their `2>/dev/null || true` would have shipped a tarball with no
      # LICENSE in it without failing.
      - name: Package tar.gz + checksum
        env:
          AWL_VERSION: ${{ needs.plan.outputs.version }}
        run: scripts/package-linux.sh target/release/awl dist-linux

      # awl's friendly Linux download, ALONGSIDE the tarball above,
      # never instead of it. Assembles the AppDir (binary, .desktop launcher,
      # the canonical icon cut from assets/macos/Awl.icns, licences — see the
      # script's own header for why no shared libraries are bundled and why
      # the icon is not a second hand-drawn asset), then cuts it into one
      # `awl-<version>-linux-x86_64.AppImage` via a pinned appimagetool. This
      # job's host (ubuntu-22.04, x86_64) is exactly the host the cut phase
      # requires, so nothing here is skipped the way a macOS dev run is.
      - name: Package AppImage + checksum
        env:
          AWL_VERSION: ${{ needs.plan.outputs.version }}
        run: scripts/package-appimage.sh target/release/awl dist-linux

      - name: Launch actual Linux download artifacts
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          UNPACK="$RUNNER_TEMP/awl-release-launch"
          mkdir -p "$UNPACK"
          tar xzf "dist-linux/awl-$VERSION-linux-x86_64.tar.gz" -C "$UNPACK"
          xvfb-run -a python3 scripts/release-launch-smoke.py --binary "$UNPACK/awl-$VERSION-linux-x86_64/awl"
          xvfb-run -a python3 scripts/release-launch-smoke.py --binary "$PWD/dist-linux/awl-$VERSION-linux-x86_64.AppImage" --appimage

      - uses: actions/upload-artifact@v7
        with:
          name: awl-linux
          path: |
            dist-linux/awl-${{ needs.plan.outputs.version }}-linux-x86_64.tar.gz
            dist-linux/awl-${{ needs.plan.outputs.version }}-linux-x86_64.tar.gz.sha256
            dist-linux/awl-${{ needs.plan.outputs.version }}-linux-x86_64.AppImage
            dist-linux/awl-${{ needs.plan.outputs.version }}-linux-x86_64.AppImage.sha256
          if-no-files-found: error
          retention-days: 14

  web:
    name: web (trunk dist, zipped)
    needs: plan
    # Dry runs only — see the header. The web build ships as the live site.
    if: needs.plan.outputs.is_release != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/project-rust
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-web

      # See the mac job's copy of this step for why it is not optional.
      - name: Install sccache
        run: scripts/install-sccache.sh

      - name: Install wasm-bindgen-cli + trunk
        run: |
          cargo install wasm-bindgen-cli --version 0.2.121 --locked
          cargo install trunk --locked

      # with-remap.sh strips the builder's $HOME/registry paths from the wasm
      # (rustc bakes compile-time source locations); this bundle is released.
      - name: trunk build --release
        run: scripts/with-remap.sh trunk build --release

      # The same licence set the Linux tarball carries, including the two
      # bundled-asset audits — the fonts and dictionaries are compiled into
      # the wasm exactly as they are into the native binary.
      - name: Zip dist/
        run: |
          mkdir -p dist-web dist/licenses
          cp LICENSE NOTICE CREDITS.md THIRD-PARTY-LICENSES.md dist/
          cp assets/fonts/LICENSES.md dist/licenses/fonts-LICENSES.md
          cp assets/dict/LICENSES.md dist/licenses/dict-LICENSES.md
          (cd dist && zip -r ../dist-web/awl-web-dist.zip .)

      - uses: actions/upload-artifact@v7
        with:
          name: awl-web
          path: dist-web/awl-web-dist.zip
          if-no-files-found: error
          retention-days: 14

  prepare-release:
    name: prepare release payload
    # Rehearsals and publication consume the same immutable verified payload.
    needs: [plan, checks, extended, mac, mac-staged, linux]
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.checks.result == 'success' &&
      needs.extended.result == 'success' && needs.linux.result == 'success' &&
      ((needs.mac.result == 'success' && needs.mac-staged.result == 'skipped') ||
       (needs.mac.result == 'skipped' && needs.mac-staged.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: awl-linux
          path: artifacts/linux

      - uses: actions/download-artifact@v8
        with:
          name: awl-macos
          path: artifacts/mac

      - name: Select public payload and build checksum manifest
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          scripts/prepare-release-payload.sh \
            artifacts/linux artifacts/mac release "$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: awl-release-payload
          path: release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish GitHub Release
    needs: [plan, checks, extended, prepare-release]
    if: needs.plan.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Refuse existing releases or mismatched tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-plan.py check-publication
      - uses: actions/download-artifact@v8
        with:
          name: awl-release-payload
          path: release

      - name: Verify prepared payload
        run: (cd release && sha256sum -c SHA256SUMS)

      - name: Upload verified bytes to a draft
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: v${{ needs.plan.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.plan.outputs.is_prerelease }}
          make_latest: false
          overwrite_files: false
          fail_on_unmatched_files: true
          body: |
            **macOS Apple Silicon (arm64).** Download the Apple Silicon DMG.
            It contains a Developer ID signed, notarized and stapled Awl app.
            Verify the download, open it, and drag Awl to Applications:

            ```sh
            grep -F '  awl-${{ needs.plan.outputs.version }}-macos-arm64.dmg' SHA256SUMS | shasum -a 256 -c -
            open awl-${{ needs.plan.outputs.version }}-macos-arm64.dmg
            ```

            **macOS Intel (x86_64).** Download the Intel DMG instead:

            ```sh
            grep -F '  awl-${{ needs.plan.outputs.version }}-macos-x86_64.dmg' SHA256SUMS | shasum -a 256 -c -
            open awl-${{ needs.plan.outputs.version }}-macos-x86_64.dmg
            ```

            **Linux x86_64.** Choose the AppImage or tarball below. Windows
            uses the web editor.

            **AppImage (recommended)** — one file, desktop-integrated (launcher
            name + icon):

            ```sh
            grep -F '  awl-${{ needs.plan.outputs.version }}-linux-x86_64.AppImage' SHA256SUMS | sha256sum -c -
            chmod +x awl-${{ needs.plan.outputs.version }}-linux-x86_64.AppImage
            ./awl-${{ needs.plan.outputs.version }}-linux-x86_64.AppImage notes.md
            ```

            Needs a Vulkan driver, fontconfig, libxkbcommon, and Wayland or X11
            already on the system (see below) — nothing else is bundled, and no
            GPU driver rides inside the AppImage.

            **tar.gz (fallback)** — for systems where AppImages don't run (no
            FUSE and no `--appimage-extract-and-run` support):

            ```sh
            grep -F '  awl-${{ needs.plan.outputs.version }}-linux-x86_64.tar.gz' SHA256SUMS | sha256sum -c -
            tar xzf awl-${{ needs.plan.outputs.version }}-linux-x86_64.tar.gz
            cd awl-${{ needs.plan.outputs.version }}-linux-x86_64
            ./awl notes.md
            ```

            The archive unpacks into one directory and installs nothing. Put it
            on your PATH with `install -Dm755 awl ~/.local/bin/awl`.

            awl needs a working Vulkan driver, fontconfig, libxkbcommon, and
            Wayland or X11. `README.txt` inside the archive lists the package
            names per distro; `GLIBC.txt` records the glibc version this build
            requires. Fonts and dictionaries are compiled in — awl never
            fetches anything at runtime.

            GPL-3.0-only. `LICENSE`, `NOTICE`, `CREDITS.md`,
            `THIRD-PARTY-LICENSES.md` and licences ride inside every download.
          files: |
            release/awl-${{ needs.plan.outputs.version }}-linux-x86_64.tar.gz
            release/awl-${{ needs.plan.outputs.version }}-linux-x86_64.AppImage
            release/awl-${{ needs.plan.outputs.version }}-macos-arm64.dmg
            release/awl-${{ needs.plan.outputs.version }}-macos-x86_64.dmg
            release/SHA256SUMS

      - name: Verify GitHub asset digests before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-plan.py check-uploaded

      - name: Publish verified draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.is_prerelease }}
          LATEST: ${{ needs.plan.outputs.channel == 'stable' }}
        run: gh release edit "v$VERSION" --draft=false --prerelease="$PRERELEASE" --latest="$LATEST" --repo "$GITHUB_REPOSITORY"
