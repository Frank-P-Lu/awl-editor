name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux (build + test)
    runs-on: ubuntu-latest
    # The native gate is intentionally exhaustive and currently takes about
    # 35 minutes on a cold hosted runner. Keep enough variance headroom while
    # retaining a finite ceiling for genuine hangs.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          # code-health's checked-in debt baseline is a real commit, not a
          # regenerated ignore list, so this job needs that one object.
          fetch-depth: 0

      # System deps mirror Dockerfile.linux's apt-get list, PLUS
      # mesa-vulkan-drivers so the wgpu-backed capture tests have a software
      # Vulkan adapter to run against on a headless GitHub runner (there is
      # no real GPU here).
      #
      # ‼ THIS IS NOT A VIRTUALISED-GPU ARM, and item 232 measured that rather
      # than assuming it. lavapipe is a CPU rasteriser: each process gets its
      # own llvmpipe in its own address space, with no driver-internal pipeline
      # table and nothing shared between processes. Item 231's wedge is a
      # SYSTEM-WIDE contention (two processes with two separate wgpu devices
      # stopped within 10 ms of each other), so there is no resource here for
      # it to exhaust. The evidence, not the argument: this job ran the same
      # `scripts/native-gate.sh` — full suite, both conventions, every
      # `render::tests::` — green on the very commits where `mac` hung, for the
      # whole ~140-commit red streak. Run 30770386873 (`00199724`, which
      # contains `8207e519`) is the clean pair: `linux` issued
      # `native-gate-receipt … conventions=mac,linux scope=all-targets` off a
      # Mesa 25.2.8 lavapipe runner in 971 s while `mac` failed at 58m03s. A
      # local arm64 lavapipe container (Debian bookworm, Mesa 22.3.6) agrees:
      # `render::tests::` at `8207e519` and at `36707d06` never once hung —
      # every termination was a prompt, diagnosable SIGKILL, never the hosted
      # runner's park-forever-in-poll. So this arm buys real Linux/Vulkan
      # coverage and buys NOTHING on the virtualised-GPU axis; do not cite it as
      # that axis's arm. The `mac` job below is it.
      #
      # ‼ WHAT THAT CONTAINER *DID* SEE, and item 231 should have it: under a
      # FIXED 4 GiB ceiling at `--test-threads=1`, `render::tests::` walks RSS
      # up monotonically and is OOM-killed — and how far it gets is exactly
      # commit-correlated. `36707d06` reaches test 199; `8207e519` reaches test
      # 160. Twice each, identical both times. The same suite peaks at 448 MiB
      # on the dev host's Metal (CLAUDE.md's gate note), so this is not portable
      # as an RSS number — but it is item 231's own residual suspects
      # (per-call `glyphon::Cache` + `TextAtlas`, `offscreen()` textures and
      # readback buffers, reclaimed only on poll) made visible and deterministic
      # in ~4 local minutes. It does NOT prove that bounding the growth would
      # have prevented the hang; nothing measured here says that.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libfontconfig1-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            mesa-vulkan-drivers

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # sccache installs AFTER the cache restore (item 196): install-sccache.sh
      # short-circuits when the pinned version is already on PATH, but nothing
      # puts it there before this step runs — so with this step first, every
      # job did a full `cargo install sccache` (~4-7 wall-minutes) even though
      # rust-cache's registry/target cache would have supplied cargo-machete
      # and cargo-deny for free from the same restore, proven by those two
      # installs measuring 0.0m right after it. Restoring first lets the
      # install-sccache measurement decide whether the cache actually carries
      # the sccache binary (`~/.cargo/bin`), which Swatinem/rust-cache@v2
      # caches by default.
      - name: Install sccache
        run: scripts/install-sccache.sh

      # The health command owns its exact tool version and every check. CI only
      # installs that requested checker before invoking the shared entry point.
      - name: Install code-health tools
        run: cargo install cargo-machete --version "$(bash scripts/code-health.sh --cargo-machete-version)" --locked

      - name: Rust code health
        run: bash scripts/code-health.sh

      # The shared wrapper owns the pinned cargo-deny version and every
      # dependency-policy decision; CI must not restate policy in YAML.
      - name: Install dependency-policy tool
        run: cargo install cargo-deny --version "$(bash scripts/audit.sh --cargo-deny-version)" --locked

      - name: Dependency policy
        run: bash scripts/audit.sh

      # Dev-profile build + test, matching local practice (CLAUDE.md's build
      # section runs `cargo build` / `cargo test`, not --release). No
      # artifact upload for v1 — nothing built here is `--release`, and
      # speed matters more than a dev binary nobody will download.
      - name: cargo build
        run: cargo build

      # The canonical native gate owns its integration canary, both supported
      # conventions, and exact-commit receipt. Do not reconstruct this here:
      # `cargo test --bin awl` is binary unit tests, not the full native suite.
      - name: native full suite
        run: scripts/native-gate.sh

      # A push is the combined-main train. Pull requests/worktree landings keep
      # the fast dev-only loop; once the train is assembled, compare one real
      # headless replay per ActionFamily across debug and release sidecars.
      - name: Debug/release sidecar parity
        if: github.event_name == 'push'
        run: scripts/release-profile-gate.sh

  # ── AT-SPI bridge liveness (item 252) — separate from `linux`, deliberately ──
  # Question this answers, narrowly: does AccessKit's Unix adapter actually
  # register with the AT-SPI2 accessibility bus on real Linux and publish the
  # tree `SemanticSnapshot` intends — the document, item 218's STABLE LINE
  # RUNS, focus, and a live selection? `ACCESSIBILITY.md:65` names AT-SPI2 as
  # the Linux half of AccessKit's platform backend and states plainly that no
  # AT-SPI journey has ever been run against it, and item 218 (`c282cedd`)
  # rewrote both the activation handler and the document's shape without any
  # Linux gate able to see either change. This job is bridge LIVENESS AND
  # STRUCTURE, mechanically, on every push/PR — `scripts/ci-atspi-probe.py`
  # has the actual assertions and their rationale.
  #
  # ‼ THIS IS NOT ITEM 251 AND DOES NOT CLOSE IT. There is no Orca here, no
  # human, no ears — a hosted runner has no desktop session for a screen
  # reader to sit in front of. The probe asserts STRUCTURE over the AT-SPI
  # wire (roles, children, text, focus, a keyboard-driven selection); it says
  # nothing about what a screen reader user would hear or how navigation
  # feels. Item 251 still owns that, and still needs a human at a real Linux
  # desktop.
  #
  # TOLERATED, not gating (a deliberate choice, following item 243's lesson
  # rather than repeating its precedent verbatim): this is BRAND NEW CI
  # infrastructure — Xvfb, a window manager, D-Bus session-bus activation,
  # at-spi2-registryd, and a hand-written AT-SPI client — none of which this
  # repo's CI has ever exercised before, unlike item 243's split where the
  # gating half was already measured completing reliably. Item 243's lesson
  # was that a red carrying no information is worse than no arm at all;
  # gating `main` on a brand-new four-layer stack's first runs would risk
  # blocking unrelated work on infra flakiness this job has not yet proven it
  # lacks, not on real accessibility regressions. `continue-on-error` is set
  # at the JOB level, mirroring `mac-render-tests`' shape: a red run here is
  # attributable to item 252 by name from this file alone. Promote to gating
  # once it has run green on `main` for a stretch — a conscious decision, not
  # automatic, exactly as item 231's fix promotes `mac-render-tests`.
  atspi:
    name: "atspi (AT-SPI2 bridge liveness, item 252) — allowed failure while it beds in"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      # Build deps mirror the `linux` job's list (including mesa-vulkan-
      # drivers — awl is a real wgpu/Vulkan window even under Xvfb) plus the
      # AT-SPI stack: xvfb (virtual display), fluxbox (xdotool's keyboard
      # injection needs real X11 input focus, which bare Xvfb does not
      # reliably grant), dbus (dbus-run-session, for accessibility-bus
      # activation), at-spi2-core (at-spi-bus-launcher + at-spi2-registryd),
      # xdotool (drives the live selection keystroke), and the GI Atspi
      # client bindings the probe script uses.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libfontconfig1-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            mesa-vulkan-drivers \
            xvfb fluxbox dbus at-spi2-core xdotool \
            gir1.2-atspi-2.0 python3-gi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: atspi

      - name: Install sccache
        run: scripts/install-sccache.sh

      # Dev-profile build, matching the `linux` job — this arm is not
      # `native-gate.sh` and claims no suite coverage; it exists only to
      # produce a real binary for the probe to launch.
      - name: cargo build
        run: cargo build

      - name: AT-SPI bridge probe
        run: scripts/ci-atspi-probe.sh target/debug/awl

  web:
    name: web (wasm build + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: web

      # sccache installs after the cache restore — see the linux job's
      # comment (item 196): a full `cargo install sccache` ahead of the
      # restore paid ~4-7 minutes every run regardless of whether the cache
      # already carried the binary.
      - name: Install sccache
        run: scripts/install-sccache.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      # wasm-bindgen-cli's version must match the crate's pinned wasm-bindgen
      # (Cargo.toml: 0.2.121, see WEB.md). trunk builds the release web
      # bundle (dist/) for the artifact upload.
      - name: Install wasm-bindgen-cli + trunk
        run: |
          cargo install wasm-bindgen-cli --version 0.2.121 --locked
          cargo install trunk --locked

      # L1 (crate compiles to wasm32) + L2 (src/websmoke.rs
      # #[wasm_bindgen_test]s run through the node runner) — see
      # scripts/web-smoke.sh's own header comment for the stage breakdown.
      - name: scripts/web-smoke.sh (L1 + L2)
        run: scripts/web-smoke.sh

      # with-remap.sh strips the builder's $HOME/registry paths from the wasm
      # (rustc bakes compile-time source locations); the uploaded artifact is
      # public, so it must carry no builder path.
      - name: trunk build --release
        run: scripts/with-remap.sh trunk build --release

      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist/
          retention-days: 14

  # ── mac, split in two by item 243 (user decision 2026-08-03) ────────────────
  # Item 232 asked whether a portable software adapter could stand in for
  # hosted macOS's virtualised Metal and measured NO on two independent
  # stacks: the `linux` job's x86_64 lavapipe (green on the exact commits
  # where this job hung, all streak long) and a local arm64 lavapipe
  # container at `8207e519`/`36707d06`, which never hung once. A CPU
  # rasteriser has no system-wide GPU resource for a cross-process wedge to
  # exhaust — which is what item 231 measured when two processes with two
  # separate wgpu devices stopped within 10 ms of each other. So a hosted-mac
  # job stays the ONLY place awl looks at that axis; no local arm, and no
  # slower local gate, can substitute (item 232's explicit refusals).
  #
  # Item 232's lane recommended declaring the whole job the arm and gating on
  # it (option C). The USER CHOSE THE SPLIT instead, 2026-08-03 (item 243):
  # gating on a red job would have blocked `main` until item 231 is fixed,
  # and 231 is now a diagnosis item with no promised fix date. Item 231's own
  # discriminating probe measured that `render::tests::` is the one module
  # that hangs — `--skip render::tests::` COMPLETED at 2860 tests per
  # convention in 110 s, while standing up its own device per test and
  # building ~80,000 GPU programs in aggregate, i.e. doing MORE total GPU
  # work than the module that hangs. So the split below restores the
  # distinction the whole red streak erased: a red run now says WHICH half,
  # by name, instead of "the mac job is red" meaning nothing anyone could act
  # on.
  #
  # `mac` gates immediately: it is `mac (build + test)` minus the one module
  # item 231 is still diagnosing, and it passes today at no cost. The
  # isolated module lives in `mac-render-tests` below — tolerated red,
  # pinned by name to item 231 in this file, not only on the board. When 231
  # lands, that job goes green and is promoted to gating; no further
  # decision is needed, which is why this shape needs deciding only once.
  #
  # `scripts/native-gate.sh` forbids any filter by construction (its receipt
  # means "unfiltered, both conventions, every target" and nothing else), so
  # neither job below calls it: each runs `cargo test` directly and neither
  # claims a "native-gate-receipt". Per CLAUDE.md/README, any filtered
  # invocation is "targeted tests", never "full native suite" — that
  # authorization still comes only from a developer's own local run.
  mac:
    name: mac (build + test, minus render::tests)
    runs-on: macos-latest
    # Both conventions filtered to ~95% of the suite measured at 110 s each
    # (item 231); this ceiling is headroom over cold-cache compile, not a
    # bound this job is expected to approach.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # sccache installs after the cache restore — see the linux job's
      # comment (item 196): a full `cargo install sccache` ahead of the
      # restore paid ~4-7 minutes every run regardless of whether the cache
      # already carried the binary.
      - name: Install sccache
        run: scripts/install-sccache.sh

      # This job is the only one that ever compiles `cfg(target_os = "macos")`
      # arms for real (About window, dock-icon adoption, menu bar,
      # packaging/bundle-identity paths) — the linux job's cross-clippy arm
      # only reaches the non-mac side. `--clippy-only` runs just the clippy
      # pass: cargo fmt, code-health.py and cargo-machete already run
      # tree-wide in the linux job, and repeating them on this pricier
      # runner would buy no new coverage (item 179).
      - name: Rust code health (clippy, mac-only cfg arms)
        run: bash scripts/code-health.sh --clippy-only

      - name: cargo build
        run: cargo build

      - name: cargo test, minus render::tests (mac convention)
        run: env AWL_CONVENTION_FORCE=mac cargo test -- --skip render::tests

      - name: cargo test, minus render::tests (linux convention)
        run: env AWL_CONVENTION_FORCE=linux cargo test -- --skip render::tests

  # ── The isolated wedge, tolerated red and pinned to item 231 by name ────────
  # This is the ONLY thing this job runs, so a red run here is attributable
  # to item 231 from this file alone: the hosted macOS runner's virtualised
  # Metal stack HANGS — does not fail, hangs — inside `render::tests::`,
  # every libtest worker parking at the same instant and never moving. Signal
  # run 30778330964 (`69f379f7`): `web`, `linux` and `mac live-probe` all
  # green, `mac (build + test)` alone failed with "native-gate: ABORTED on
  # its 1500s budget with mac_status=143 linux_status=143; no receipt
  # issued". That is item 231's signature; do not read a red run here as a
  # new regression without checking that item first, and do not read a green
  # run here as item 231 fixed without confirming it stays green — the
  # exhausted resource still has no confirming measurement (item 231's own
  # entry has the full diagnosis-in-progress).
  #
  # `continue-on-error` is set at the JOB level and is the whole point: a red
  # run here must never fail this workflow.
  #
  # ‼ IT TOLERATES A FAILED JOB, NOT A CANCELLED ONE, AND A STEP THAT EXCEEDS
  # `timeout-minutes` IS CANCELLED RATHER THAN FAILED. Cancellation propagates
  # to the workflow's conclusion, so relying on the runner's timeout to bound
  # the hang defeats the split. Measured, not reasoned: the first run after the
  # split (30825396088) had all four gating jobs green — `mac (build + test,
  # minus render::tests)`, `linux`, `web`, `mac live-probe` — and still
  # concluded `cancelled`, because this job hit its step timeout at 60m33s.
  #
  # So the hang is bounded INSIDE the step by `scripts/ci-wedge-budget.sh`,
  # which kills the run and exits non-zero — an ordinary failure, which
  # `continue-on-error` does tolerate. `timeout-minutes` stays as a BACKSTOP,
  # set ABOVE that budget, for the different failure it was written for: the
  # hosted runner losing communication with the server (upstream
  # actions/runner-images#13882, the same mode the old unsplit job fought at
  # job-minute 53-62), which no in-process watchdog can survive.
  mac-render-tests:
    name: "mac (render::tests) — allowed failure, item 231"
    runs-on: macos-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # `cache-on-failure` stops a red (or hung) run here from making the
      # NEXT one harder: rust-cache saves only on success by default, and
      # without this a target/ frozen at a stale commit would force a full
      # rebuild of the accumulated delta on every subsequent run.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install sccache
        run: scripts/install-sccache.sh

      - name: cargo build
        run: cargo build

      # `timeout-minutes` here is enforced by the runner agent, not our
      # shell, so it survives a genuinely hung process. 40 minutes puts each
      # step comfortably inside the job's 90-minute ceiling with both steps
      # run, and inside the runner-loss window observed on the old unsplit
      # job (job-minute 53-62).
      - name: render::tests (mac convention) — allowed to hang or fail
        timeout-minutes: 35
        run: "scripts/ci-wedge-budget.sh mac render::tests:: 1500"

      - name: render::tests (linux convention) — allowed to hang or fail
        timeout-minutes: 35
        run: "scripts/ci-wedge-budget.sh linux render::tests:: 1500"

  # ── The mac live-probe (free mac-VM tier — now GATING) ──────────────────────
  # GitHub's macos-latest runners are real macOS VMs with a WindowServer, and
  # the "does a headful awl window PRESENT frames there?" question has been
  # answered YES: a headful awl window clears the wgpu occlusion gate (an
  # NSWindow lacking NSWindowOcclusionStateVisible returns Occluded BEFORE
  # nextDrawable() → presents=0 — see CLAUDE.md's --soak-gpu tripwire) and the
  # deterministic --soak-gpu stimulus schedule runs its full GPU contract. So
  # awl's "live-only" bug tier (present/compositor races, redraw-scheduling
  # gaps) is now reproducible in ordinary CI — and worth GATING on: a
  # soak-contract regression (frames stop presenting, an injected GPU fault
  # fails to recover, slideshow-grade degradation) should turn main red here.
  #
  # GATING (eyes-open, user decision 2026-07-22): the earlier three
  # failure-swallowing layers are GONE — the job-level and step-level
  # `continue-on-error: true`, and `scripts/ci-live-probe.sh`'s terminal
  # always-`exit 0`. The probe propagates a non-zero exit when the soak fails
  # its verification contract, and that exit reds the run. Still NOT run on
  # pull_request (fires on push to main and on manual workflow_dispatch) — a
  # SEPARATE job from the gating `mac` job, so it gates independently.
  #
  # ONE VERDICT (item 53, 2026-07-23): the soak BINARY's exit status is the sole
  # oracle. `report.passed()` owns every hard gate — a real surface, the
  # presents FLOOR (>=100), the absolute cycle contract (300/300/150), all three
  # faults recovered, and live memory samples — and `awl` bails nonzero on any
  # miss. `ci-live-probe.sh` only launches it and tails the report for humans;
  # it no longer re-derives a second, script-side pass/fail that could disagree
  # with the process exit. And the soak now RUNS TO SCHEDULE COMPLETION (bounded
  # by a 2x-duration grace), so a slightly-slow shared VM that walks the last
  # ~5% of the schedule late still PASSES instead of being guillotined at the
  # nominal 25s — the false-red that made every main push fail.
  mac-live-probe:
    name: mac live-probe (free mac-VM tier — gating)
    runs-on: macos-latest
    if: github.event_name != 'pull_request'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # sccache installs after the cache restore — see the linux job's
      # comment (item 196): a full `cargo install sccache` ahead of the
      # restore paid ~4-7 minutes every run regardless of whether the cache
      # already carried the binary — expensive here in particular, since this
      # job otherwise only runs a 25s probe.
      - name: Install sccache
        run: scripts/install-sccache.sh

      # Launches a SHORT headful --soak-gpu and propagates the binary's exit
      # status — the single verdict (presents floor / cycle contract / faults /
      # recovery / memory all live in report.passed()). A soak-contract failure
      # exits non-zero and fails this (gating) job; the script only tails the
      # report for humans.
      - name: live-probe (does the mac VM present frames?)
        run: scripts/ci-live-probe.sh 25
