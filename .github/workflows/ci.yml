name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux (build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: scripts/linux-build-deps.sh test

      - uses: ./.github/actions/project-rust

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install sccache
        run: scripts/install-sccache.sh

      - name: Install code-health tools
        run: cargo install cargo-machete --version "$(bash scripts/code-health.sh --cargo-machete-version)" --locked

      - name: Install dependency-policy tool
        run: cargo install cargo-deny --version "$(bash scripts/audit.sh --cargo-deny-version)" --locked

      - name: Dependency policy
        run: bash scripts/audit.sh

      - name: cargo build
        run: cargo build

      # Every non-render unit and integration target, both input conventions.
      # The unfiltered GPU suite and native receipt belong to nightly.
      - name: Rust code health and tooling laws
        run: bash scripts/code-health.sh

      - name: Non-render correctness (mac convention)
        run: env AWL_CONVENTION_FORCE=mac cargo test -- --skip render::tests

      - name: Non-render correctness (linux convention)
        run: env AWL_CONVENTION_FORCE=linux cargo test -- --skip render::tests

      - name: Alternate menu-bar policy
        run: env AWL_MENU_BAR_FORCE=off cargo test --bin awl -- --skip render::tests

      - name: Debug/release sidecar parity
        if: github.event_name == 'push'
        run: scripts/release-profile-gate.sh

  web:
    name: web (wasm build + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/project-rust
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: web

      - name: Install sccache
        run: scripts/install-sccache.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install wasm-bindgen-cli
        run: |
          cargo install wasm-bindgen-cli --version 0.2.121 --locked

      - name: scripts/web-smoke.sh (L1 + L2)
        run: |
          command -v wasm-bindgen-test-runner
          scripts/web-smoke.sh

  mac:
    name: mac (build + test, minus render::tests)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/project-rust

      - uses: Swatinem/rust-cache@v2

      - name: Install sccache
        run: scripts/install-sccache.sh

      - name: Rust code health (clippy, mac-only cfg arms)
        run: bash scripts/code-health.sh --clippy-only

      - name: cargo build
        run: cargo build

      - name: cargo test, minus render::tests (mac convention)
        run: env AWL_CONVENTION_FORCE=mac cargo test -- --skip render::tests

      - name: cargo test, minus render::tests (linux convention)
        run: env AWL_CONVENTION_FORCE=linux cargo test -- --skip render::tests

  mac-live-probe:
    name: mac live-probe (free mac-VM tier — gating)
    runs-on: macos-latest
    if: github.event_name != 'pull_request'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/project-rust

      - uses: Swatinem/rust-cache@v2

      - name: Install sccache
        run: scripts/install-sccache.sh

      - name: live-probe (does the mac VM present frames?)
        run: scripts/ci-live-probe.sh 25
