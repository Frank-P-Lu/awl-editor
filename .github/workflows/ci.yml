name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux (build + test)
    needs: [linux-health, linux-correctness]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every Linux lane
        env:
          HEALTH_RESULT: ${{ needs.linux-health.result }}
          TEST_RESULT: ${{ needs.linux-correctness.result }}
        run: test "$HEALTH_RESULT" = success && test "$TEST_RESULT" = success

  linux-health:
    name: linux health and dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install system dependencies
        run: scripts/linux-build-deps.sh test
      - uses: ./.github/actions/project-rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux
          save-if: false
      - name: Install sccache
        run: scripts/install-sccache.sh
      - name: Policy tool versions
        id: policy-tools
        run: |
          echo "machete=$(bash scripts/code-health.sh --cargo-machete-version)" >> "$GITHUB_OUTPUT"
          echo "deny=$(bash scripts/audit.sh --cargo-deny-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/cargo-machete
            ~/.cargo/bin/cargo-deny
          key: policy-tools-${{ env.ImageOS }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ steps.policy-tools.outputs.machete }}-${{ steps.policy-tools.outputs.deny }}
      - name: Install code-health tools
        env:
          TOOL_VERSION: ${{ steps.policy-tools.outputs.machete }}
        run: |
          if ! cargo machete --version 2>/dev/null | grep -Fxq "$TOOL_VERSION"; then
            cargo install cargo-machete --version "$TOOL_VERSION" --locked
          fi
      - name: Install dependency-policy tool
        env:
          TOOL_VERSION: ${{ steps.policy-tools.outputs.deny }}
        run: |
          if ! cargo deny --version 2>/dev/null | grep -Fq "$TOOL_VERSION"; then
            cargo install cargo-deny --version "$TOOL_VERSION" --locked
          fi
      - name: Dependency policy
        run: bash scripts/audit.sh
      - name: Rust code health and tooling laws
        run: bash scripts/code-health.sh
      - name: Debug/release sidecar parity
        if: github.event_name == 'push'
        run: scripts/release-profile-gate.sh

  linux-correctness:
    name: linux correctness (${{ matrix.convention }} convention)
    strategy:
      fail-fast: false
      matrix:
        convention: [mac, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install system dependencies
        run: scripts/linux-build-deps.sh test
      - uses: ./.github/actions/project-rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux
          cache-on-failure: true
          save-if: ${{ matrix.convention == 'linux' }}
      - name: Install sccache
        run: scripts/install-sccache.sh
      - name: Core correctness, pixel regressions and menu policy
        env:
          CONVENTION: ${{ matrix.convention }}
        run: python3 scripts/ci-linux-tests.py "$CONVENTION"

  web:
    name: web (wasm build + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/project-rust
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: web

      - name: Install sccache
        run: scripts/install-sccache.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install wasm-bindgen-cli
        run: |
          cargo install wasm-bindgen-cli --version 0.2.121 --locked

      - name: scripts/web-smoke.sh (L1 + L2)
        run: |
          command -v wasm-bindgen-test-runner
          scripts/web-smoke.sh

  mac:
    name: mac (build + test, minus render::tests)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/project-rust

      - uses: Swatinem/rust-cache@v2

      - name: Install sccache
        run: scripts/install-sccache.sh

      - name: Rust code health (clippy, mac-only cfg arms)
        run: bash scripts/code-health.sh --clippy-only

      - name: cargo build
        run: cargo build

      - name: cargo test, minus render::tests (mac convention)
        run: env AWL_CONVENTION_FORCE=mac cargo test -- --skip render::tests

      - name: cargo test, minus render::tests (linux convention)
        run: env AWL_CONVENTION_FORCE=linux cargo test -- --skip render::tests

  mac-live-probe:
    name: mac live-probe (free mac-VM tier — gating)
    runs-on: macos-latest
    if: github.event_name != 'pull_request'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/project-rust

      - uses: Swatinem/rust-cache@v2

      - name: Install sccache
        run: scripts/install-sccache.sh

      - name: live-probe (does the mac VM present frames?)
        run: scripts/ci-live-probe.sh 25
