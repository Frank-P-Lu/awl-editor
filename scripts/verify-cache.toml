# The SMALL, EXPLICIT registry scripts/verify_cache.py caches against. Not a
# generic dependency framework: adding a check here is a conscious, reviewed
# edit, the same shape as println_audit.rs's own EXPECTED table. A check not
# listed here is never cached (scripts/verify_cache.py run <name> refuses it).
#
# `source_globs` / `tests` / `config` are git-pathspecs resolved against
# tracked files only (scripts/verify_cache.py's tracked_files) — an untracked
# or gitignored file can never invalidate or validate a cached result.
# `env_branches` names environment variables this check's OWN behavior
# depends on; naming none is a checked claim that the command reads none, not
# an oversight (see verify_cache.py's env_branch_values docstring).

[[check]]
name = "println_audit"
command = ["cargo", "test", "--bin", "awl", "--", "println_audit"]
# The audit scans every tracked file under src/ (src/println_audit.rs::scan_dir),
# so its whole input set IS src/**/*.rs — a change anywhere in the tree can
# add, move, or remove a println!/eprintln! the audit must see.
source_globs = [":(glob)src/**/*.rs"]
tests = ["src/println_audit.rs"]
config = ["Cargo.toml", "Cargo.lock"]
env_branches = []

[[check]]
name = "view_policy"
command = ["cargo", "test", "--bin", "awl", "--", "view_policy"]
source_globs = [
  "src/capture.rs",
  ":(glob)src/capture/**/*.rs",
  "src/view_policy.rs",
  "src/app/viewstate.rs",
]
tests = ["src/view_policy.rs"]
config = ["Cargo.toml", "Cargo.lock"]
env_branches = []
