# Reviewed historical exceptions for the two metrics that run in code-health.py.
# Identity is exact: lint + file + primary line + complete diagnostic text.
# Removing, moving, or increasing a recorded function makes this entry stale.
#
# The frozen file-size baseline is intentionally old: it is each file's size
# at the pinned BASELINE commit, and a file may never exceed it — that is the
# one hard, non-negotiable ceiling, checked directly against that commit's
# content, not against this table. A mark below is the live high-water line
# code-health.py actually enforces (min(baseline, mark)); it is not itself a
# second ceiling, only bookkeeping for where that line currently sits.
#
# A mark must be lowered with every legitimate shrink. It may also rise —
# strictly below the frozen baseline, never past it — when growth genuinely
# cannot be avoided at a single-owner seam: an exhaustive construction site, a
# one-owner accessor sequence, a dispatch call site the design (CLAUDE.md's
# architecture) requires to stay singular, where decomposing instead would
# break the exhaustiveness or ownership property the seam exists for. Such a
# raise is only legitimate with a `reason` field naming the seam and the size
# delta; it is never a substitute for extraction the file can actually afford.
# A raise recorded relative to `main` with no `reason` fails the gate
# (code-health.py: check_mark_raises). That comparison only has force where
# HEAD differs from `main` — a worker's worktree branch, checked before
# landing. HEAD-is-`main` (CI's push-to-`main` job, and the merge train's
# post-merge candidate) is a vacuous comparison-to-itself and is reported as
# SKIPPED, not as a clean audit (code-health.py: previous_marks). Do not read
# "the ledger enforces raise reasons" as something CI verifies generally.

